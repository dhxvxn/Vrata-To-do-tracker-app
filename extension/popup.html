<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    body { width: 340px; background: #000; color: #fafafa; padding: 16px; }
    .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .logo { width: 22px; height: 22px; background: #fff; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
    .logo span { color: #000; font-weight: 800; font-size: 13px; }
    h1 { font-size: 14px; font-weight: 700; letter-spacing: .05em; }
    .sub { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: .15em; margin-bottom: 4px; }
    .score { font-size: 44px; font-weight: 200; line-height: 1; }
    .row { display: flex; gap: 10px; margin: 12px 0; }
    .card { flex: 1; background: #09090b; border: 1px solid #27272a; border-radius: 10px; padding: 10px 12px; }
    .card .n { font-size: 20px; font-weight: 300; }
    .card .l { font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
    .green { color: #22c55e; } .red { color: #ef4444; }
    .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #18181b; font-size: 12px; }
    .item .g { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d4d4d8; }
    .item .v { color: #71717a; font-variant-numeric: tabular-nums; font-size: 11px; }
    .badge { font-size: 8px; text-transform: uppercase; letter-spacing: .1em; padding: 2px 5px; border-radius: 4px; font-weight: 700; }
    .b-study { background: #14532d; color: #4ade80; } .b-off { background: #3f1d1d; color: #f87171; } .b-gate { background: #3b0764; color: #d8b4fe; }
    h2 { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: .15em; margin: 14px 0 4px; }
    .empty { color: #52525b; font-size: 11px; padding: 8px 0; }
    a.opt { display: block; margin-top: 14px; font-size: 11px; color: #71717a; text-decoration: none; text-align: center; }
    a.opt:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="logo"><span>V</span></div>
    <h1>VRATA FOCUS</h1>
  </div>
  <div id="app"><p class="empty">Loading…</p></div>
  <a class="opt" href="#" id="opt">⚙ Edit site categories &amp; keywords</a>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
